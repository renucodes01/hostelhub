<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | HostelHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body class="grad">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-3">
      <a href="index.html" class="text-decoration-none"><h3 class="fw-bold" style="color:var(--p1)"><i class="bi bi-building-fill me-2"></i>HostelHub</h3></a>
      <p class="text-muted small mb-0">Welcome! Please login or create a student account</p>
    </div>
    <ul class="nav nav-pills nav-justified mb-4">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tLogin">Login</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tReg" id="regTab">Student Register</button></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="tLogin">
        <form id="loginForm">
          <div class="mb-3"><label class="form-label">Email</label><input type="email" id="lEmail" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Password</label><input type="password" id="lPass" class="form-control" required></div>
          <button class="btn btn-grad w-100">Login</button>
          <p class="small text-muted text-center mt-3 mb-0">Warden demo: warden@hostel.com / warden123</p>
        </form>
      </div>
      <div class="tab-pane fade" id="tReg">
        <form id="regForm">
          <div class="row g-2">
            <div class="col-12"><input id="rName" class="form-control" placeholder="Full name" required></div>
            <div class="col-12"><input id="rEmail" type="email" class="form-control" placeholder="Email" required></div>
            <div class="col-12"><input id="rPass" type="password" class="form-control" placeholder="Password (min 6)" minlength="6" required></div>
            <div class="col-6"><input id="rPhone" class="form-control" placeholder="Phone"></div>
            <div class="col-6"><input id="rCourse" class="form-control" placeholder="Course (e.g. B.Sc CS)"></div>
            <div class="col-6"><select id="rYear" class="form-select"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
            <div class="col-6"><input id="rGName" class="form-control" placeholder="Guardian name"></div>
            <div class="col-12"><input id="rGPhone" class="form-control" placeholder="Guardian phone"></div>
          </div>
          <button class="btn btn-grad w-100 mt-3">Create Account</button>
        </form>
      </div>
    </div>
    <div id="msg" class="alert alert-danger py-2 mt-3 d-none"></div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
  if (token() && me()) location.href = me().role === 'warden' ? 'warden.html' : 'student.html';
  if (location.hash === '#register') new bootstrap.Tab(document.getElementById('regTab')).show();

  function done(r) {
    localStorage.setItem('hms_token', r.token);
    localStorage.setItem('hms_user', JSON.stringify(r.user));
    location.href = r.user.role === 'warden' ? 'warden.html' : 'student.html';
  }
  function fail(x) { $('#msg').removeClass('d-none').text(errMsg(x)); }

  $('#loginForm').on('submit', function (e) {
    e.preventDefault(); $('#msg').addClass('d-none');
    api('POST', '/auth/login', { email: $('#lEmail').val(), password: $('#lPass').val() }).done(done).fail(fail);
  });
  $('#regForm').on('submit', function (e) {
    e.preventDefault(); $('#msg').addClass('d-none');
    api('POST', '/auth/register', {
      name: $('#rName').val(), email: $('#rEmail').val(), password: $('#rPass').val(), phone: $('#rPhone').val(),
      course: $('#rCourse').val(), year: $('#rYear').val(), guardianName: $('#rGName').val(), guardianPhone: $('#rGPhone').val()
    }).done(done).fail(fail);
  });
</script>
</body></html>
