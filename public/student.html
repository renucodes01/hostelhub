<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Dashboard | HostelHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<aside class="sidebar">
  <div class="brand"><i class="bi bi-building-fill me-2"></i>HostelHub</div>
  <div class="mt-3">
    <a class="nav-item active" data-sec="home"><i class="bi bi-house"></i>My Room</a>
    <a class="nav-item" data-sec="fees"><i class="bi bi-cash-coin"></i>My Fees</a>
    <a class="nav-item" data-sec="complaints"><i class="bi bi-tools"></i>Complaints</a>
    <a class="nav-item" data-sec="profile"><i class="bi bi-person"></i>Profile</a>
    <a class="nav-item" onclick="logout()"><i class="bi bi-box-arrow-left"></i>Logout</a>
  </div>
</aside>
<div class="main">
  <div class="topbar d-flex justify-content-between align-items-center">
    <div><button class="btn btn-light menu-btn me-2"><i class="bi bi-list"></i></button><b id="title">My Room</b></div>
    <span class="text-muted"><i class="bi bi-person-circle me-1"></i><span id="who"></span></span>
  </div>

  <div class="section show" id="home">
    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="stat s1"><small>Room</small><h3 id="hRoom">-</h3><i class="bi bi-door-open-fill"></i></div></div>
      <div class="col-md-4"><div class="stat s4"><small>Pending Fees</small><h3 id="hPending">₹0</h3><i class="bi bi-hourglass-split"></i></div></div>
      <div class="col-md-4"><div class="stat s3"><small>Open Complaints</small><h3 id="hComp">0</h3><i class="bi bi-chat-dots-fill"></i></div></div>
    </div>
    <div class="panel"><h6 class="fw-semibold">Room Details</h6><div id="roomInfo" class="text-muted">Loading...</div></div>
  </div>

  <div class="section" id="fees"><div class="panel"><div class="table-responsive"><table class="table align-middle">
    <thead><tr><th>Title</th><th>Amount</th><th>Due</th><th>Status</th><th>Paid On</th><th>Method</th></tr></thead>
    <tbody id="feeBody"></tbody></table></div></div></div>

  <div class="section" id="complaints"><div class="row g-3">
    <div class="col-lg-4"><div class="panel"><h6 class="fw-semibold">Raise a Complaint</h6>
      <form id="compForm">
        <select id="cCat" class="form-select mb-2"><option>Electrical</option><option>Plumbing</option><option>Cleaning</option><option>Food/Mess</option><option>Internet</option><option>Furniture</option><option>Other</option></select>
        <input id="cTitle" class="form-control mb-2" placeholder="Title" required>
        <textarea id="cDesc" class="form-control mb-2" rows="4" placeholder="Describe the issue..." required></textarea>
        <button class="btn btn-grad w-100">Submit</button>
      </form></div></div>
    <div class="col-lg-8"><div class="panel"><h6 class="fw-semibold">My Complaints</h6><div class="table-responsive"><table class="table align-middle">
      <thead><tr><th>Issue</th><th>Date</th><th>Status</th><th>Warden Remark</th></tr></thead><tbody id="compBody"></tbody></table></div></div></div>
  </div></div>

  <div class="section" id="profile"><div class="panel" style="max-width:640px">
    <h6 class="fw-semibold mb-3">My Profile</h6>
    <p class="mb-1"><b id="pName"></b></p><p class="text-muted" id="pEmail"></p>
    <form id="profForm" class="row g-2">
      <div class="col-6"><label class="form-label">Phone</label><input id="pPhone" class="form-control"></div>
      <div class="col-6"><label class="form-label">Course</label><input id="pCourse" class="form-control"></div>
      <div class="col-6"><label class="form-label">Year</label><select id="pYear" class="form-select"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
      <div class="col-6"><label class="form-label">Guardian name</label><input id="pGName" class="form-control"></div>
      <div class="col-12"><label class="form-label">Guardian phone</label><input id="pGPhone" class="form-control"></div>
      <div class="col-12"><button class="btn btn-grad mt-2">Save Changes</button></div>
    </form></div></div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body></html>
